[package]
name = "flexaccess-iroh"
version = "0.0.20"
edition = "2024"
description = "Shared iroh transport layer for FlexAccess applications: relay configuration and probing, endpoint building, in-place home-relay failover, and the endpoint-bound public-key auth transcript"
license = "MIT"
repository = "https://github.com/flexaccessdev/flexaccess-iroh"

[features]
default = []
# mDNS local-network address lookup on every endpoint built by
# `endpoint::endpoint_builder`. Compiled out on iOS regardless (raw multicast
# needs the `com.apple.developer.networking.multicast` entitlement there).
mdns = ["dep:iroh-mdns-address-lookup", "dep:swarm-discovery"]
# The on-demand `/healthz` check of the custom relays for status UIs
# (`relay_health`). Off by default: it is the only part that makes plain HTTP
# requests, so a consumer without a status view does not pay for it.
relay-health = ["dep:reqwest", "dep:serde", "dep:webpki-roots"]

[dependencies]
anyhow = "1"
base64 = "0.22"
# Shared FlexAccess auth key format (`ed25519-sec:` / `ed25519-pub:` tokens,
# key files, authorized-keys parsing). Re-exported as `flexaccess_keys` so
# consumers see exactly the version this crate signs and verifies with.
flexaccess-keys = { git = "https://github.com/flexaccessdev/flexaccess-keys", tag = "v0.0.2", default-features = false }
futures = "0.3"
# A range, deliberately: every consumer resolves one `iroh` 1.5.x for its own
# workspace and this crate compiles against it. A consumer on a fork of iroh
# redirects this dependency too with `[patch.crates-io]` (see README.md).
# `unstable-net-report` exposes `Endpoint::net_report`, which the startup probe
# reads to tell whether a custom relay serves QUIC address discovery
# (`relay::probe_relay`). Being unstable is why the range stays within one
# minor release.
iroh = { version = ">=1.5.0, <1.6.0", features = ["unstable-net-report"] }
log = "0.4"
# `relay-health` only. `rustls-no-provider` is the exact reqwest feature iroh
# already enables, so this adds no new TLS backend (no openssl / aws-lc); the
# probe hands reqwest a ring + webpki-roots config, so the platform verifier is
# never built into the client.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
# `relay-health` only: the status type crosses process boundaries (status
# sockets, FFI JSON) in the applications.
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# `relay-health` only: the embedded Mozilla roots, the same ones iroh verifies
# the relay connection with.
webpki-roots = { version = "1", optional = true }

# iroh's mDNS lookup sends raw UDP multicast, which iOS rejects without the
# multicast entitlement, so it is never even a dependency there.
#
# `swarm-discovery` is never used directly: it is a floor on the version
# iroh-mdns-address-lookup resolves. Before 0.6.5 its updater GC task
# reschedules itself every 10ms forever once the discovery is dropped — one
# spinning task leaked per closed endpoint, so a client that rebuilds its
# endpoint through a long outage burns CPU that grows with every rebuild
# (rkuhn/swarm-discovery#27).
[target.'cfg(not(target_os = "ios"))'.dependencies]
iroh-mdns-address-lookup = { version = "0.6.1", optional = true }
swarm-discovery = { version = "0.6.5", optional = true }

[dev-dependencies]
# The e2e harness (`examples/e2e`, driven by the scripts in `e2e/`): a
# command line and a logger for a server/client pair that exercises this
# crate over real relays. Dev-only, so consumers never pay for them.
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
# Test double for iroh's `Watcher`-based status APIs (the relay failover tests
# drive a plain `Watchable`); the same crate iroh itself re-exports `Watcher` from.
n0-watcher = "1"
tokio = { version = "1", features = ["full", "test-util"] }
